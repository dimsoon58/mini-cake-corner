name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Client-side (VITE_) values — safe to expose, they ship in the built JS by design
      VITE_SUPABASE_PROJECT_ID: ekciarsrdyismyevgkqg
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_r06FD7vRhva5JrCvL0pHfA__pu0UkXP
      VITE_SUPABASE_URL: https://ekciarsrdyismyevgkqg.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Served at the root of the custom domain (bentocakestudio.ch), not
      # under /mini-cake-corner/ — that subpath only applied to the plain
      # github.io project-page URL.
      - run: npx vite build --base=/
      - name: Keep preview out of search engines (noindex only on Pages)
        run: perl -pi -e 's|</head>|<meta name="robots" content="noindex, nofollow" />\n</head>|' dist/index.html
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
