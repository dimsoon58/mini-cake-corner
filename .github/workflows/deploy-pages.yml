name: CI & Deploy to GitHub Pages

# 2026-09-14: gated the existing GitHub Pages deploy behind lint/type-check/
# build/smoke-test checks (see docs/CI.md) — a push to `main` still always
# succeeds (no branch protection, nothing here rejects the push itself), but
# a broken push no longer reaches production: `deploy` only runs if `checks`
# passes in full. The SAME dist/ build (built once, with the real
# --base=/mini-cake-corner/ GitHub Pages needs) is what gets smoke-tested
# AND published — never a second, separately-built artifact for smoke
# testing alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push/PR update supersedes whatever this workflow was still doing
# for the previous one — no point finishing checks (or a deploy) for code
# that's already been replaced.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Client-side (VITE_) values — safe to expose, they ship in the built JS by design
      VITE_SUPABASE_PROJECT_ID: ekciarsrdyismyevgkqg
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_r06FD7vRhva5JrCvL0pHfA__pu0UkXP
      VITE_SUPABASE_URL: https://ekciarsrdyismyevgkqg.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build (GitHub Pages base path)
        run: npx vite build --base=/mini-cake-corner/

      - name: Keep preview out of search engines (noindex only on Pages)
        run: perl -pi -e 's|</head>|<meta name="robots" content="noindex, nofollow" />\n</head>|' dist/index.html
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test priority routes (same dist/ as above, same base path)
        run: npm run test:smoke
        env:
          SMOKE_BASE_PATH: /mini-cake-corner

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: checks
    # Only a real push to main may deploy — never a PR (a PR only ever runs
    # `checks`, reporting pass/fail, exactly the "prepared for PRs later"
    # behaviour) and never a run whose `checks` job failed: `needs: checks`
    # already means this job is skipped entirely unless checks succeeded in
    # full, so a broken lint/type-check/build/smoke-test result can never
    # reach production, even though the push to `main` itself always
    # succeeds — no branch protection is being added here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
