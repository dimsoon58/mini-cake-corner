project_id = "ekciarsrdyismyevgkqg"

[functions.send-make-webhook]
verify_jwt = false

# Called by Supabase Auth's Send Email Hook itself, not by an end user —
# authenticated via the standardwebhooks signature (SEND_EMAIL_HOOK_SECRET)
# inside the function, never a user JWT.
[functions.send-auth-email]
verify_jwt = false

# Test de connexion, a supprimer une fois l'integration validee.
[functions.postfinance-selftest]
verify_jwt = false

# PostFinance Checkout webhook — called by PostFinance, not a Supabase client.
# Authenticated by the ?s=<POSTFINANCE_WEBHOOK_SECRET> URL secret (and an
# optional ECDSA payload signature) inside the function, never a user JWT.
[functions.postfinance-webhook]
verify_jwt = false

# Periodic side-effect recovery sweep — called by pg_cron / an external cron,
# not a Supabase client. Authenticated by the ?s=<RETRY_SWEEP_SECRET> URL
# secret inside the function, never a user JWT.
[functions.retry-order-side-effects]
verify_jwt = false

# READ-ONLY pending_payments health check — same pattern as retry-order-side-
# effects. Authenticated by the ?s=<HEALTH_CHECK_SECRET> URL secret inside the
# function, never a user JWT. Added by the 2026-09-11/12 consolidation audit.
[functions.health-check-pending-payments]
verify_jwt = false
